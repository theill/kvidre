[package]
name = "kvidre"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
jiff = "0.2.38"
open = "5.4.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
textwrap = "0.16.4"
